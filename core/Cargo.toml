[package]
name = "gvcore"
version = "0.1.0"
edition = "2021"
description = "GenerativeView core: metadata extraction, search index, thumbnails"
publish = false

[lib]
name = "gvcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
allo-isolate = "0.1"
crossbeam-channel = "0.5"
fast_image_resize = "5"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
jpeg-encoder = "0.6"
notify = "8"
parking_lot = "0.12"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
