name: scaffold
on:
  push:
    branches: [scaffold]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Generate platform scaffolding
        run: |
          flutter --version
          flutter create --platforms=linux,android --org com.jrufer --project-name generativeview --no-pub .
          flutter pub add ffi path_provider permission_handler media_kit media_kit_video media_kit_libs_linux media_kit_libs_android_video
          flutter --version > .flutter-version.txt
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Flutter Linux and Android scaffolding (flutter create)"
          git push
