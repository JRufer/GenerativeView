# TEMPORARY (removed before merge): runs the analyzer and the screenshot
# tests for the generation tools, and pushes their output and screenshots to
# the gen-tools-shots branch, where they can be read without the Actions
# artifact store.
name: gen-tools-shots
on:
  push:
    branches: [feat/generation-tools]
permissions:
  contents: write
concurrency:
  group: gen-tools-shots
  cancel-in-progress: true
env:
  FLUTTER_VERSION: 3.47.7
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - timeout-minutes: 12
        continue-on-error: true
        run: |
          for i in 1 2 3; do timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && break; done
          sudo apt-get -o Acquire::Retries=3 install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv ffmpeg
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build core
        working-directory: core
        run: cargo build --release --lib
      - name: Sample images
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI_examples.git "$RUNNER_TEMP/samples"
      - name: Detail models
        run: |
          d="$RUNNER_TEMP/detail"; mkdir -p "$d/retinaface" "$d/anime_face_v1.4_n" "$d/anime_hand_v1.0_n"
          curl -sSfL -o "$d/retinaface/mobilenet0.25_Final.pth" https://huggingface.co/py-feat/retinaface/resolve/main/mobilenet0.25_Final.pth
          curl -sSfL -o "$d/anime_face_v1.4_n/model.pt" https://huggingface.co/deepghs/anime_face_detection/resolve/main/face_detect_v1.4_n/model.pt
          curl -sSfL -o "$d/anime_hand_v1.0_n/model.pt" https://huggingface.co/deepghs/anime_hand_detection/resolve/main/hand_detect_v1.0_n/model.pt
          mkdir -p "$RUNNER_TEMP/sam"
          curl -sSfL -o "$RUNNER_TEMP/sam/model.safetensors" https://huggingface.co/nielsr/mobilesam/resolve/main/model.safetensors
          curl -sSfL -o "$RUNNER_TEMP/sam/mobile_sam.pt" https://huggingface.co/dhkim2810/MobileSAM/resolve/main/mobile_sam.pt
          ls -lR "$d" "$RUNNER_TEMP/sam"
      - name: Detectors against the real models
        working-directory: core
        env:
          GV_DETAIL_MODELS: ${{ runner.temp }}/detail
          GV_SAM_MODEL: ${{ runner.temp }}/sam/model.safetensors
          GV_SAMPLE_DIR: ${{ runner.temp }}/samples
        run: |
          mkdir -p ../out
          cargo test --release --lib -- detect:: sam:: --nocapture --test-threads=1 > ../out/detect.txt 2>&1 || true
          tail -30 ../out/detect.txt
      - name: Reference boxes from Ultralytics (check only)
        env:
          D: ${{ runner.temp }}/detail
          S: ${{ runner.temp }}/samples
        run: |
          pip install -q ultralytics > /dev/null 2>&1 || true
          python3 - > out/reference.txt 2>&1 <<'PY' || true
          import os
          from ultralytics import YOLO
          d, s = os.environ['D'], os.environ['S']
          for model, th in [('anime_face_v1.4_n/model.pt', 0.278), ('anime_hand_v1.0_n/model.pt', 0.264)]:
              m = YOLO(os.path.join(d, model))
              for name in ['flux/girl_in_field.png', 'chroma/fennec_girl_flowers.png', 'z_image/z_image_turbo_example.png', 'sdxl/sdxl_simple_example.png']:
                  r = m.predict(os.path.join(s, name), conf=th, imgsz=640, verbose=False)[0]
                  w, h = r.orig_shape[1], r.orig_shape[0]
                  print(model, name, [(round(float(b[0])/w, 3), round(float(b[1])/h, 3), round(float(b[2])/w, 3), round(float(b[3])/h, 3), round(float(c), 3)) for b, c in zip(r.boxes.xyxy, r.boxes.conf)])
          PY
          cat out/reference.txt
      - name: Reference mask from MobileSAM in PyTorch (check only)
        env:
          M: ${{ runner.temp }}/sam/mobile_sam.pt
          S: ${{ runner.temp }}/samples
        run: |
          pip install -q timm "git+https://github.com/ChaoningZhang/MobileSAM.git" > /dev/null 2>&1 || true
          python3 - > out/sam_reference.txt 2>&1 <<'PY' || true
          import os, numpy as np, torch
          from PIL import Image
          from mobile_sam import sam_model_registry, SamPredictor
          sam = sam_model_registry["vit_t"](checkpoint=os.environ['M']).eval()
          p = SamPredictor(sam)
          img = np.array(Image.open(os.path.join(os.environ['S'], 'flux/girl_in_field.png')).convert('RGB'))
          p.set_image(img)
          print('embedding mean', float(p.features.mean()))
          h, w = img.shape[:2]
          masks, scores, _ = p.predict(point_coords=np.array([[0.5 * w, 0.7 * h]]), point_labels=np.array([1]), multimask_output=True)
          m = masks[int(np.argmax(scores))]
          ys, xs = np.nonzero(m)
          print('scores', scores.tolist())
          print('box', xs.min() / w, ys.min() / h, xs.max() / w, ys.max() / h, 'area', m.mean())
          PY
          cat out/sam_reference.txt
      - name: Analyze and test
        env:
          GV_SCREENSHOT_DIR: ${{ github.workspace }}/out/screens
          GV_SAMPLE_DIR: ${{ runner.temp }}/samples
          GV_DETAIL_MODELS: ${{ runner.temp }}/detail
          GV_SAM_MODEL: ${{ runner.temp }}/sam/model.safetensors
        run: |
          mkdir -p out/screens
          flutter pub get > out/pub.txt 2>&1 || true
          flutter analyze > out/analyze.txt 2>&1 || true
          tests=$(ls test/ui_audit_test.dart test/gen_tools_test.dart test/backend_parity_test.dart test/backends_test.dart 2>/dev/null || true)
          timeout 40m flutter test --reporter expanded $tests > out/test.txt 2>&1 || true
          echo "${{ github.sha }}" > out/RUN.txt
          tail -5 out/test.txt
      - name: Publish the report
        if: always()
        run: |
          cd out
          git init -q -b gen-tools-shots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "report ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gen-tools-shots
