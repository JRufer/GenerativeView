name: build

# Builds and tests everything on each push:
#   core      Rust unit and integration tests
#   linux     analyzer, UI tests against the real core, release bundle, and
#             the built app driven inside a virtual display
#   windows   Rust core build, UI tests, and release zip
#   macos     Universal Rust core build, UI tests, and release zip
#   android   release APKs for arm64-v8a, armeabi-v7a and x86_64
#   emulator  the app installed and driven on an emulated Android tablet
#
# Every push to main then publishes what was built as a release named
# build-<run number> (the newest ten are kept). Pushing a tag like v0.1.0
# publishes a release under that name instead.
#
# Android signing: set the repository secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD (see README) and every APK carries the same
# signature, so a new build installs over the last. Without them each run
# signs with a throwaway key and Android asks for an uninstall first.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  CARGO_TERM_COLOR: never

jobs:
  core:
    name: Rust core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Test
        working-directory: core
        run: cargo test
      - name: Licence notices match Cargo.lock
        # The app's licences page lists every crate compiled into the core;
        # a dependency change must come with tool/gen-licenses.py re-run.
        run: |
          (cd core && cargo fetch --locked)
          python3 tool/gen-licenses.py --check

  libmpv:
    # libmpv for the AppImage to fall back on where the system has none (no
    # mpv installed, or Ubuntu 22.04's older one). Built on the oldest system
    # the AppImage supports, so it runs on anything newer.
    name: libmpv for the AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: libmpv-bundle
          key: libmpv-ubuntu22.04-${{ hashFiles('tool/build-libmpv-bundle.sh') }}
      - name: Build libmpv and gather what it needs
        if: steps.cache.outputs.cache-hit != 'true'
        run: tool/build-libmpv-bundle.sh libmpv-bundle
      - name: Check it plays every kind of video the app shows
        run: |
          # A second of picture and sound in each format, made with the
          # distro's full FFmpeg, then played through the bundle alone.
          # Plus what any desktop has and the bundle leaves to it (graphics,
          # sound); the build step installs these too, but it is skipped when
          # the bundle comes from the cache.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libegl1 libgl1 libpulse0 libasound2 >/dev/null
          clips="$RUNNER_TEMP/clips"
          mkdir -p "$clips"
          clip() {
            local name="$1"; shift
            if ! ffmpeg -v error -y -f lavfi -i testsrc2=duration=1:size=320x240:rate=12 \
              -f lavfi -i sine=duration=1:frequency=440 -shortest -pix_fmt yuv420p "$@" "$clips/$name" 2>"$clips.err"; then
              echo "::warning::Could not make $name: $(tail -1 "$clips.err")"
              rm -f "$clips/$name"
            fi
          }
          clip h264-aac.mp4 -c:v libx264 -c:a aac
          clip h265-aac.mp4 -c:v libx265 -tag:v hvc1 -c:a aac
          clip av1-opus.mp4 -c:v libaom-av1 -cpu-used 8 -c:a libopus
          clip vp9-opus.webm -c:v libvpx-vp9 -c:a libopus
          clip vp8-vorbis.webm -c:v libvpx -c:a libvorbis
          clip h264-flac.mkv -c:v libx264 -c:a flac
          clip av1-opus.mkv -c:v libaom-av1 -cpu-used 8 -c:a libopus
          clip mpeg4-mp3.m4v -f mp4 -c:v mpeg4 -c:a libmp3lame
          clip prores-pcm.mov -c:v prores_ks -pix_fmt yuv422p10le -c:a pcm_s16le
          clip h264-alac.mov -c:v libx264 -c:a alac
          ffmpeg -v error -y -f lavfi -i testsrc2=duration=1:size=320x240:rate=12 -pix_fmt yuv420p -c:v libx264 "$clips/silent-h264.mp4"
          ls "$clips"
          set -o pipefail
          python3 tool/check-libmpv-bundle.py libmpv-bundle "$clips"/* 2>&1 | sed -E 's/^(Traceback|  File|[A-Za-z]+Error)/::error::\1/'
          test "$(ls "$clips" | wc -l)" -ge 11 || { echo "::error::Too few clips could be made"; exit 1; }
          echo "::notice::libmpv bundle: $(du -sh libmpv-bundle | cut -f1), $(ls libmpv-bundle | wc -l) files: $(ls libmpv-bundle | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-bundle
          path: libmpv-bundle/
          if-no-files-found: error

  linux:
    name: Linux app
    runs-on: ubuntu-24.04
    needs: [libmpv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-bundle
          path: ${{ runner.temp }}/libmpv-bundle
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv ffmpeg xvfb libgl1-mesa-dri imagemagick
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Rust core
        working-directory: core
        run: cargo build --release --lib
      - run: flutter pub get
      - name: Analyze
        run: |
          # Echo each finding as an annotation so it shows on the run page.
          set -o pipefail
          flutter analyze 2>&1 | tee /dev/stderr \
            | sed -E -n 's/^ *(info|warning|error) • (.*) • ([^ ]+):([0-9]+):[0-9]+ • ([a-z_]+)$/::warning file=\3,line=\4::\2 [\5]/p'
      - name: Test (the real UI against the real core)
        env:
          GV_SCREENSHOT_DIR: ${{ runner.temp }}/screens
        run: flutter test
      - name: Build Linux bundle and AppImage
        run: |
          flutter build linux --release --build-number="$GITHUB_RUN_NUMBER"
          bundle=build/linux/x64/release/bundle
          mkdir -p "$bundle/share" dist
          cp linux/packaging/generativeview.desktop "$bundle/share/"
          cp assets/icon.png "$bundle/share/generativeview.png"
          cp LICENSE "$bundle/share/LICENSE"
          cp tool/install-linux.sh "$bundle/install.sh"
          tar -C build/linux/x64/release -czf dist/generativeview-linux-x64.tar.gz bundle
          MPV_BUNDLE="$RUNNER_TEMP/libmpv-bundle" tool/build-appimage.sh "$bundle" dist/GenerativeView-x86_64.AppImage
      - name: Integration test (the built app in a virtual display)
        env:
          GV_SCREENSHOT_DIR: ${{ runner.temp }}/screens
          GV_FIXTURES: ${{ github.workspace }}/core/tests/fixtures
          GV_TEST_VIDEO: "1"
        run: xvfb-run -a -s "-screen 0 1440x900x24" flutter test integration_test/app_test.dart -d linux
      - name: Smoke-test the AppImage
        env:
          GV_SCREENSHOT_DIR: ${{ runner.temp }}/screens
        run: |
          # Start it on the folder the integration test left behind, then
          # check that it stayed up and actually rendered thumbnails (which
          # only happens if the bundled Rust core loaded and indexed).
          export APPIMAGE_EXTRACT_AND_RUN=1
          export XDG_DATA_HOME="$RUNNER_TEMP/appimage-data" XDG_CACHE_HOME="$RUNNER_TEMP/appimage-cache"
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            dist/GenerativeView-x86_64.AppImage /tmp/gv-integration &
            pid=$!
            sleep 15
            import -window root "$GV_SCREENSHOT_DIR/appimage.png" || true
            kill -0 "$pid" || { echo "::error::The AppImage exited on its own"; exit 1; }
            kill "$pid"
          '
          thumbs=$(find "$XDG_CACHE_HOME" -name '*.jpg' | wc -l)
          echo "::notice::AppImage rendered $thumbs thumbnails"
          test "$thumbs" -ge 5
      - name: Smoke-test the AppImage on Ubuntu 22.04 without mpv
        run: |
          # The oldest system it supports, with what any desktop has (GTK, sound,
          # a display) and no mpv: the
          # AppImage must start on the libmpv it carries.
          mkdir -p "$RUNNER_TEMP/screens"
          docker run --rm \
            -v "$PWD/dist:/dist:ro" -v /tmp/gv-integration:/pictures:ro -v "$RUNNER_TEMP/screens:/screens" \
            ubuntu:22.04 bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends libgtk-3-0 libasound2 libpulse0 libegl1 libgl1 libgles2 libgl1-mesa-dri xvfb xauth imagemagick >/dev/null
              if ldconfig -p | grep -q "libmpv\.so\.2 "; then echo "::error::libmpv is installed, so this proves nothing"; exit 1; fi
              cp -r /pictures /tmp/pictures
              export APPIMAGE_EXTRACT_AND_RUN=1 XDG_DATA_HOME=/tmp/data XDG_CACHE_HOME=/tmp/cache
              xvfb-run -a -s "-screen 0 1440x900x24" bash -c "
                /dist/GenerativeView-x86_64.AppImage /tmp/pictures > /tmp/app.log 2>&1 &
                pid=\$!
                sleep 20
                import -window root /screens/appimage-ubuntu22.png || true
                if ! kill -0 \$pid; then echo ::error::The AppImage exited on Ubuntu 22.04; grep -v \"^\\s*\$\" /tmp/app.log | tail -15 | sed \"s/^/::error::/\"; exit 1; fi
                kill \$pid
              "
              thumbs=$(find /tmp/cache -name "*.jpg" | wc -l)
              echo "::notice::On Ubuntu 22.04 without mpv, the AppImage rendered $thumbs thumbnails"
              test "$thumbs" -ge 5
            '
      - uses: actions/upload-artifact@v4
        with:
          name: generativeview-linux-x64
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          key: android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Build Rust core for Android
        run: tool/build-android-core.sh
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so these APKs are signed with a throwaway key and will not install over an earlier build. See README, 'Signing key'."
            password=throwaway
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass "$password" \
              -alias generativeview -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GenerativeView throwaway"
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install the NDK Flutter builds with
        run: |
          # Gradle would fetch it on its own, but a broken download there
          # fails the whole build ("Error on ZipFile unknown archive"); here
          # it gets a few tries.
          ndk=$(grep -rhoE 'val ndkVersion: String = "[0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/" | head -1 | grep -oE '[0-9][0-9.]+')
          test -n "$ndk"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            if [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ]; then break; fi
            echo "Installing NDK $ndk (try $attempt)"
            rm -rf "$ANDROID_HOME/ndk/$ndk"
            yes | "$sdkmanager" --install "ndk;$ndk" >/dev/null || true
            [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ] || sleep 20
          done
          test -f "$ANDROID_HOME/ndk/$ndk/source.properties" || { echo "::error::Could not install NDK $ndk"; exit 1; }
      - name: Build APKs
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --build-number="$GITHUB_RUN_NUMBER"
      - name: Check the APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          echo "$certs"
          # The release key must have been used, not Gradle's debug fallback.
          if echo "$certs" | grep -q "Android Debug"; then
            echo "::error::APK was signed with the debug key"
            exit 1
          fi
          echo "::notice::Signed by: $(echo "$certs" | grep -m1 'certificate DN')"
      - uses: actions/upload-artifact@v4
        with:
          name: generativeview-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  emulator:
    name: Android emulator test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          key: android-x64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install the NDK Flutter builds with
        run: |
          # Gradle would fetch it on its own, but a broken download there
          # fails the whole build ("Error on ZipFile unknown archive"); here
          # it gets a few tries.
          ndk=$(grep -rhoE 'val ndkVersion: String = "[0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/" | head -1 | grep -oE '[0-9][0-9.]+')
          test -n "$ndk"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            if [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ]; then break; fi
            echo "Installing NDK $ndk (try $attempt)"
            rm -rf "$ANDROID_HOME/ndk/$ndk"
            yes | "$sdkmanager" --install "ndk;$ndk" >/dev/null || true
            [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ] || sleep 20
          done
          test -f "$ANDROID_HOME/ndk/$ndk/source.properties" || { echo "::error::Could not install NDK $ndk"; exit 1; }
      - name: Build Rust core for the emulator
        run: |
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked
          tool/build-android-core.sh x86_64
          flutter pub get
      - name: Enable KVM and the emulator's libraries
        run: |
          # The runner image no longer carries PulseAudio, which the emulator
          # binary links against even with -noaudio; without it the emulator
          # dies on launch and the boot times out.
          sudo apt-get update
          sudo apt-get install -y libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration test on an emulated tablet
        id: emulator
        # Informational: the hosted emulator breaks now and then for reasons
        # outside the app, so a failure here warns rather than failing the
        # build. The APK, the Linux app and the core tests still gate.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ runner.temp }}/emulator
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tool/ci-android-emulator.sh
      - name: Report an emulator failure
        if: steps.emulator.outcome == 'failure'
        run: echo "::warning title=Android emulator test failed::The emulated-tablet integration test did not pass (not blocking). See the emulator-screenshots artifact and the step log."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: ${{ runner.temp }}/emulator
          if-no-files-found: ignore

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          key: windows
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Rust core for Windows
        working-directory: core
        run: cargo build --release --lib
      - run: flutter pub get
      - name: Test
        run: flutter test
      - name: Build Windows release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --build-number="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/winbuild.txt"
      # TEMPORARY (removed before merge): the build output, readable without the log viewer.
      - name: Publish the build output
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP/winbuild.txt" "$RUNNER_TEMP/out/" || true
          cd "$RUNNER_TEMP/out"
          git init -q -b ci-out-windows
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "windows build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out-windows
      - name: Package Windows ZIP
        shell: bash
        run: |
          mkdir -p dist
          bundle="build/windows/x64/runner/Release"
          cp LICENSE "$bundle/"
          cd "$bundle"
          7z a -tzip "$GITHUB_WORKSPACE/dist/GenerativeView-windows-x64.zip" *
      - uses: actions/upload-artifact@v4
        with:
          name: generativeview-windows-x64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          key: macos
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build universal Rust core for macOS
        run: tool/build-macos-core.sh
      - run: flutter pub get
      - name: Test
        run: flutter test
      - name: Build macOS release
        run: flutter build macos --release --build-number="${{ github.run_number }}"
      - name: Package macOS application
        run: |
          mkdir -p dist
          app="build/macos/Build/Products/Release/generativeview.app"
          mkdir -p "$app/Contents/Frameworks"
          cp core/target/release/libgvcore.dylib "$app/Contents/Frameworks/"
          install_name_tool -id "@rpath/libgvcore.dylib" "$app/Contents/Frameworks/libgvcore.dylib"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" dist/GenerativeView-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: generativeview-macos-universal
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [core, libmpv, linux, android, emulator, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mkdir out
          cp dist/generativeview-linux-x64/GenerativeView-x86_64.AppImage out/
          cp dist/generativeview-linux-x64/generativeview-linux-x64.tar.gz out/
          for apk in dist/generativeview-android/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "out/GenerativeView-$abi.apk"
          done
          cp dist/generativeview-windows-x64/GenerativeView-windows-x64.zip out/
          cp dist/generativeview-macos-universal/GenerativeView-macos-universal.zip out/
          ls -la out

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes out/*
            exit 0
          fi

          tag="build-$GITHUB_RUN_NUMBER"
          {
            echo "Automatic build of \`${GITHUB_SHA::7}\`: $(echo "$COMMIT_SUBJECT" | head -1)"
            echo
            echo "- **Linux**: \`GenerativeView-x86_64.AppImage\` — \`chmod +x\` it and run. Runs on Ubuntu 22.04, Debian 12, Arch and newer, on Wayland or X11. Needs GTK 3, and \`ffmpeg\` for video thumbnails; it brings its own video player library where \`mpv\` isn't installed. The \`.tar.gz\` is the same app as a plain folder with an \`install.sh\`."
            echo "- **Windows**: \`GenerativeView-windows-x64.zip\` — unzip and run \`generativeview.exe\`."
            echo "- **macOS**: \`GenerativeView-macos-universal.zip\` — unzip and run \`generativeview.app\` (Universal binary for Apple Silicon and Intel Macs)."
            echo "- **Android**: \`GenerativeView-arm64-v8a.apk\` for tablets and phones."
            echo
            echo "GenerativeView is released under the [MIT License](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/LICENSE). Third-party licences are listed in the app under ⋮ → About → Open-source licences."
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Build $GITHUB_RUN_NUMBER" --notes-file notes.md --latest out/*

          # Keep the ten newest automatic builds.
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name | select(startswith("build-"))' \
            | sort -t- -k2 -n -r | tail -n +11 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
